custom:
  security:
    salt-length: 20
    hash-length: 44
    parallelism: 16
    memory: 32768
    iterations: 16
  id-generator:
    name: "SAFIA-API"
    instance: 1
    version: "1.0"
  # jwt:
  #   key:
  #     location: classpath:public_rsa.pub

logging:
  level:
    '[org.springframework.security]': trace
  log4j2:
    config:
      override:
        - log4j2-spring.xml

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - modulith
          - "*"
  observations:
    annotations:
      enabled: true
    key-values:
      region: "south-america-1"
      stack: "dsv"
  # otlp:
  #   metrics:
  #     export:
  #       url: http://localhost:4318/v1/metrics
  prometheus:
    metrics:
      tags:
        application: safia
      export:
        pushgateway:
          job: safia-actuator
        enabled: true

server:
  port: 8080

  tomcat:
    max-connections: 1024
    threads:
      max: 128


spring:
  application:
    name: safia
    version: 1.0.0

  # cache:
  #   redis:
  #     key-prefix: "safia:"
  #     time-to-live: 20000
  #     cache-null-values: false
  #     use-key-prefix: true

  # data:
  #   redis:
  #     database: 0
  #     host: localhost
  #     port: 6379
  #     client-name: safia-cache
  #     username: default
  #     connect-timeout: 60000

  datasource:
    url: jdbc:postgresql://localhost:5444/db_safia
    username: user_safia
    password: P455W0RD_S4F14
    driver-class-name: org.postgresql.Driver

    hikari:
      pool-name: safia-connection-pool
      max-lifetime: 1800000
      maximum-pool-size: 20

  jpa:
    show-sql: true
    open-in-view: false
    generate-ddl: false
    hibernate:
      ddl-auto: none
    properties:
      jakarta:
        persistence:
          validation:
            mode: none
      hibernate:
        format-sql: true
        ddl-auto: none
        '[generate_statistics]': true

  lifecycle:
    timeout-per-shutdown-phase: "30s"

  main:
    keep-alive: true

  mvc:
    problemdetails:
      enabled: true

  modulith:
    detection-strategy: explicitly-annotated
    runtime:
      verification-enabled: true
      flyway-enabled: false

  profiles:
    active:
      - dev
      - stg
      - prd
    default: dev

  security:
    oauth2:
      authorizationserver:
        client:
        
          oidc-client:
            registration:
              client-id: "oidc-client"
              client-secret: "{noop}MySAFIASuperSecret"
              client-authentication-methods:
              - "client_secret_jwt"
              authorization-grant-types:
              - "authorization_code"
              - "refresh_token"
              redirect-uris:
              - "http://localhost:8080/api/auth/sign-in"
              # post-logout-redirect-uris:
              # - "http://localhost:8080/"
              scopes:
              - "openid"
              - "profile"
            require-authorization-consent: true
      # resourceserver:
      #   jwt:
      #     # issuer-uri: http://localhost:8080/api/issuer
      #     public-key-location: classpath:public_rsa.pub
    user:
      name: admin
      password: SPR1NG_4DM1N
      roles:
        - ADMIN

  threads:
    virtual:
      enabled: true

  web:
    error:
      whitelabel:
        enabled: true
        # include-message: never
        # include-stacktrace: never

springdoc:
  show-actuator: false
