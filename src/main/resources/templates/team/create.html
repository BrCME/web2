<!DOCTYPE html>
<html lang="pt-BR">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
	<link rel="shortcut icon" th:href="@{/images/favico.ico}" type="image/x-icon">
	<title>Equipe | SAFIA</title>
</head>

<body class="bg-gray-50 bg-[url(/images/splash-screen.jpg)] bg-center bg-cover bg-no-repeat">
	<div class="w-1/2 h-lvh px-[10%] flex flex-col justify-center align-center place-self-begin bg-slate-900/95">
		<h1 class="mx-4 my-3 text-4xl font-bold text-left text-gray-200 place-self-center">Bem-vindo ao SAF.IA!</h1>
		<h2 class="text-l font-bold text-center mx-6 text-gray-200 place-self-center">Faça o seu cadastro para começar a
			utiliza o sistema e começe a botar sua produtividade em dia!</h2>

		<hr class="my-6 text-gray-200">

		<form action="#" th:action="@{/team/create}" th:object="${team}" method="post" class="flex flex-col">
			<fieldset class="mb-4">
				<legend class="font-bold text-gray-200 text-left mb-4">Dados de Login</legend>

				<span class="my-2 ms-4 h-6 flex">
					<label class="font-bold text-left text-gray-200" for="name">Nome:</label>
					<input class="px-2 ml-2 bg-none border-gray-200 border-b-2 text-gray-200 size-full" id="name"
						name="name" type="text" th:field="*{name}" autofocus>
				</span>

				<span class="my-2 ms-4 h-6 flex">
					<label class="font-bold text-left text-gray-200" for="description">Descricao:</label>
					<input class="px-2 ml-2 bg-none border-gray-200 border-b-2 text-gray-200 size-full" id="description"
						name="description" type="description" th:field="*{description}">
				</span>
			</fieldset>

			<input
				class="bg-green-600 rounded-lg my-2 py-4 px-12 border-gray-200 border-xl br-10 uppercase text-gray-200 text-xl font-bold text-center cursor-pointer hover:opacity-80"
				type="submit" value="Finalizar cadastro">
		</form>

		<p class="text-sm font-normal text-gray-200 text-left place-self-start">Já tem cadastro? <a
				class="underline text-green-600" href="/auth/sign-in">fazer login</a></p>
	</div>
</body>

</html>
