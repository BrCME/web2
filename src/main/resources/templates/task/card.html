<!DOCTYPE html>
<html lang="pt-BR">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
	<title>Card | SAF.IA</title>
</head>

<body class="bg-red-700">
	<script th:src="@{/scripts/card.js}" type="text/javascript"></script>

	<div class="flex justify-center align-center w-screen h-screen bg-slate-950/85">
		<form
			class="flex flex-col justify-center place-self-center min-w-40/100 h-80/100 bg-slate-900 rounded-lg border-gray-200 border-xl border border-solid uppercase text-gray-200 text-xl font-bold text-center">

			<div
				class="flex w-full h-10/100 justify-between align-center text-start rounded-se-lg rounded-ss-lg bg-slate-400 px-4 py-2">
				<h1 class="text-gray-800 text-start place-self-center text-base w-full px-1 truncate text-nowrap">
					Editar tarefa
				</h1>
				<button>
					<img th:src="@{/svgs/close.svg}" alt="pequeno ícone vermelho de botão de fechar">
				</button>
			</div>

			<fieldset class="w-full h-50/100 px-4 overflow-y-auto bg-red-700">
				<legend class="font-bold text-gray-200 text-left text-base mb-4">Tarefa</legend>

				<span class="flex">
					<label class="font-bold text-left text-gray-200" for="nome">Nome:</label>
					<input class="px-2 ml-2 bg-none border-gray-200 border-b-2 text-gray-200 size-full" id="nome"
						name="nome" type="text">
				</span>

				<span class="flex">
					<label class="font-bold text-left text-gray-200" for="descricao">Descrição:</label>
					<textarea class="min-h-30 px-2 ml-2 bg-none border-gray-200 border-b-2 text-gray-200 size-full"
						name="descricao" id="descricao">
						Descricao bem meme mas muuuito memee mesmo
						NÚ. creedo que texto meme, nossinhora.
						Mas pensa num paragrafo grande, creeedo...
						Poderia acabar esse texto a qualquer momento, né não?
					</textarea>
				</span>

				<span class="flex">
					<label class="font-bold text-left text-gray-200" for="status">Status:</label>
					<select class="px-2 ml-2 bg-none border-gray-200 border-b-2 text-gray-200 size-full" name="status"
						id="status">
						<option class="text-gray-800" value="TO_DO">A Fazer</option>
						<option class="text-gray-800" value="DOING">Fazendo</option>
						<option class="text-gray-800" value="IN_ANALYSIS">Em Análise</option>
						<option class="text-gray-800" value="DONE">Concluido</option>
					</select>
				</span>

				<span class="flex">
					<label class="font-bold text-left text-gray-200" for="prazo">Prazo:</label>
					<input class="px-2 ml-2 bg-none border-gray-200 border-b-2 text-gray-200 size-full" id="prazo"
						name="prazo" type="datetime-local">
				</span>

			</fieldset>

			<fieldset class="w-full h-30/100 px-4 overflow-y-auto bg-sky-700">
				<legend class="font-bold text-gray-200 text-left">Trabalhadores</legend>

				<span class="flex">
					<label class="font-bold text-left text-gray-200" for="item">Delegado(s):</label>
					<input class="px-2 ml-2 bg-none border-gray-200 border-b-2 text-gray-200 w-full" id="item"
						name="item" type="text">
					<button onclick="addItem(event)"
						class="flex text-xl text-gray-200 font-bold bg-green-700 border-xl rounded-lg hover:cursor-pointer hover:opacity-80 p-1 gap-x-2">
						<img th:src="@{/svgs/new-card.svg}"
							alt="ícone pequeno de anotação com símbolo de mais ao seu centro">
					</button>
				</span>

				<span class="flex bg-green-700" id="allItems"></span>
			</fieldset>

			<div class="w-full h-10/100 flex bg-yellow-700">
				<!-- <input
					class="flex text-xl text-gray-200 font-bold bg-green-700 border-xl rounded-lg hover:cursor-pointer hover:opacity-80 p-2 gap-x-2" type="submit">
					Nova anotação
					<img th:src="@{/svgs/new-card.svg}" alt="ícone pequeno de anotação com símbolo de mais ao seu centro">
				</input> -->

				<!-- <input
					class="flex text-xl text-gray-200 font-bold bg-green-700 border-xl rounded-lg hover:cursor-pointer hover:opacity-80 p-2 gap-x-2">
					Nova anotação
					<img th:src="@{/svgs/new-card.svg}" alt="ícone pequeno de anotação com símbolo de mais ao seu centro">
				</input> -->

			</div>

		</form>
	</div>
</body>

</html>
