<!-- MODAL DE CRIAÇÃO DE ATIVIDADE NOVA -->
<div id="new-task-modal" th:fragment="new-task-modal" th:object="${project}" aria-hidden="true"
	class="flex align-center justify-center hidden overflow-y-auto overflow-x-hidden fixed top-0 left-0 z-50 justify-center items-center w-full md:inset-0 h-[calc(100%)] max-h-full bg-slate-950/85">
	<form th:action="@{/task/create}" th:object="${newTask}" method="post"
		class="flex flex-col justify-center place-self-center min-w-40/100 bg-slate-900 rounded-lg border-gray-200 border-xl border border-solid uppercase text-gray-200 text-xl font-bold text-center my-[auto]">

		<div
			class="flex w-full h-10/100 justify-between align-center text-start rounded-se-lg rounded-ss-lg bg-slate-400 px-4 py-2 mb-4">
			<h1 class="text-gray-800 text-start place-self-center text-base w-full px-1 truncate text-nowrap">
				Criar Atividade
			</h1>
			<button onclick="closeModal(event, 'new-task-modal')" class="cursor-pointer hover:opacity-80">
				<img th:src="@{/svgs/close.svg}" alt="pequeno ícone vermelho de botão de fechar">
			</button>
		</div>

		<fieldset class="w-full h-35/100 px-4 overflow-y-auto my-4">
			<legend class="font-bold text-gray-200 text-left text-base my-4">Atividade</legend>

			<input id="id" name="id" type="text" th:field="${project.id}" hidden>

			<span class="flex mb-8">
				<label class="font-bold text-left text-gray-200" for="nome">Nome:</label>
				<input class="px-2 ml-2 bg-none border-gray-200 border-b-2 text-gray-200 size-full" id="nome"
					name="nome" type="text" placeholder="Atividade Física" autofocus th:field="${newTask.name}">
			</span>

			<span class="flex">
				<label class="font-bold text-left text-gray-200" for="descricao">Descrição:</label>
				<textarea class="h-40 px-2 ml-2 bg-none border-gray-200 border-b-2 text-gray-200 size-full resize-none"
					name="descricao" id="descricao" th:field="${newTask.description}"
					placeholder="Descrição detalhada da atividade, como toda a atividade a ser desenvolvida"></textarea>
			</span>

			<span class="flex mb-8">
				<label class="font-bold text-left text-gray-200" for="status">Status:</label>
				<select class="px-2 ml-2 bg-none border-gray-200 border-b-2 text-gray-200 size-full" name="status"
					id="status" th:field="${newTask.status}">

					<option class="text-gray-800" th:each="status : ${T(com.web2.safia.models.Task.Status).values()}"
						th:value="${status}" th:text="${status}"></option>
				</select>
			</span>

			<span class="flex mb-8">
				<label class="font-bold text-left text-gray-200" for="nome">Prazo:</label>
				<input class="px-2 ml-2 bg-none border-gray-200 border-b-2 text-gray-200 size-full" id="prazo"
					name="prazo" type="datetime-local" th:field="${newTask.deadLine}">
			</span>
		</fieldset>

		<!-- <fieldset class="w-full h-50/100 px-4 overflow-y-auto my-4">
			<legend class="font-bold text-gray-200 text-left text-base my-4">Trabalhadores</legend>

			<span class="flex">
				<label class="font-bold text-left text-gray-200" for="item">Delegado(s):</label>
				<input class="px-2 ml-2 bg-none border-gray-200 border-b-2 text-gray-200 w-full" id="item" name="item"
					type="text">
				<button onclick="addItem(event)"
					class="flex text-xl text-gray-200 font-bold bg-green-700 border-xl rounded-lg cursor-pointer hover:opacity-80 p-1 gap-x-2">
					<img th:src="@{/svgs/new-card.svg}"
						alt="ícone pequeno de anotação com símbolo de mais ao seu centro">
				</button>
			</span>
		</fieldset> -->

		<div class="w-full h-10/100 flex align-center justify-center">
			<input
				class="flex uppercase text-xl text-gray-200 font-bold bg-green-700 border-xl rounded-lg cursor-pointer hover:opacity-80 p-2 my-2 gap-x-2"
				value="Criar projeto" type="submit"></input>
		</div>

	</form>
</div>

<!-- MODAL DE EDIÇÃO DE PROJETO JÁ EXISTENTE -->
<div id="edit-task-modal" th:fragment="edit-task-modal" th:object="${editProject}" aria-hidden="true"
	class="flex align-center justify-center hidden overflow-y-auto overflow-x-hidden fixed top-0 left-0 z-50 justify-center items-center w-full md:inset-0 h-[calc(100%)] max-h-full bg-slate-950/85">
	<form th:action="@{/project/update}" th:object="${editProject}" method="post"
		class="flex flex-col justify-center place-self-center min-w-40/100 bg-slate-900 rounded-lg border-gray-200 border-xl border border-solid uppercase text-gray-200 text-xl font-bold text-center my-[auto]">

		<div
			class="flex w-full h-10/100 justify-between align-center text-start rounded-se-lg rounded-ss-lg bg-slate-400 px-4 py-2 mb-4">
			<h1 class="text-gray-800 text-start place-self-center text-base w-full px-1 truncate text-nowrap">
				Editar Projeto
			</h1>
			<button onclick="closeModal(event, 'edit-task-modal')" class="cursor-pointer hover:opacity-80">
				<img th:src="@{/svgs/close.svg}" alt="pequeno ícone vermelho de botão de fechar">
			</button>
		</div>

		<fieldset class="w-full h-35/100 px-4 overflow-y-auto">
			<legend class="font-bold text-gray-200 text-left text-base my-4">Projeto</legend>

			<input id="id" name="id" type="text" th:field="*{id}" hidden>

			<span class="flex mb-8">
				<label class="font-bold text-left text-gray-200" for="nome">Nome:</label>
				<input class="px-2 ml-2 bg-none border-gray-200 border-b-2 text-gray-200 size-full" id="nome"
					name="nome" type="text" placeholder="Minha equipe nova" autofocus th:field="*{name}">
			</span>

			<span class="flex">
				<label class="font-bold text-left text-gray-200" for="descricao">Descrição:</label>
				<textarea class="h-40 px-2 ml-2 bg-none border-gray-200 border-b-2 text-gray-200 size-full resize-none"
					name="descricao" id="descricao" th:field="*{description}"
					placeholder="Descrição detalhada do projeto, como escopo geral e definição de pronto!"></textarea>

			</span>
		</fieldset>

		<fieldset class="w-full h-50/100 px-4 overflow-y-auto">
			<legend class="font-bold text-gray-200 text-left my-4">Trabalhadores</legend>

			<span class="flex">
				<label class="font-bold text-left text-gray-200" for="descricao">Gerente:</label>
				<input class="px-2 ml-2 bg-none border-gray-200 border-b-2 text-gray-200 size-full" id="gerente"
					name="gerente" type="text" placeholder="gerente@mail.com" autofocus
					th:field="${editProject.manager.email}">
			</span>

			<span class="flex">
				<label class="font-bold text-left text-gray-200" for="item">Delegado(s):</label>
				<input class="px-2 ml-2 bg-none border-gray-200 border-b-2 text-gray-200 w-full" id="item" name="item"
					type="text">
				<button onclick="addItem(event)"
					class="flex text-xl text-gray-200 font-bold bg-green-700 border-xl rounded-lg cursor-pointer hover:opacity-80 p-1 gap-x-2">
					<img th:src="@{/svgs/new-card.svg}"
						alt="ícone pequeno de anotação com símbolo de mais ao seu centro">
				</button>
			</span>

			<!-- <span class="flex bg-green-700" id="allItems"></span> -->
		</fieldset>

		<div class="w-full h-10/100 flex align-center justify-center">
			<input
				class="flex uppercase text-xl text-gray-200 font-bold bg-green-700 border-xl rounded-lg cursor-pointer hover:opacity-80 p-2 my-2 gap-x-2"
				value="Salvar" type="submit"></input>
		</div>

	</form>
</div>
