services:
  sql:
    image: postgres:17.5-alpine3.22
    container_name: safia-sql
    restart: always
    environment:
      - POSTGRES_DB=db_safia
      - POSTGRES_USER=user_safia
      - POSTGRES_PASSWORD=P455W0RD_S4F14
    ports:
      - 5444:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready", "-d", "db_safia"]
      interval: 10s
      timeout: 5s
      retries: 3
    volumes:
      - local-sql:/var/lib/postgres/data
    networks:
      - localnet

  cache:
    image: redis:8.0.3-alpine3.21
    # image: valkey:8-alpine3.22
    # image: memcached:1.6.39-alpine3.22
    container_name: safia-cache
    restart: always
    mem_limit: 1024mb
    ports:
      - 6379:6379
    volumes:
      - local-cache:/data
    networks:
      - localnet

  code-quality:
    image: sonarqube:lts-community
    container_name: safia-code-quality
    restart: always
    environment:
      - SONAR_LOGIN=safia
      - SONAR_PASSWORD=s0n4r_P455W0RD_S4F14
    ports:
      - 9000:9000
    volumes:
      - local-codequality-data:/opt/sonarqube/data
      - local-codequality-logs:/opt/sonarqube/logs
      - local-codequality-extensions:/opt/sonarqube/extensions
    networks:
      - localnet
    # token: sqp_67c73551a443a9fa2d849c51999d47339786f686

  telemetry:
    image: prom/prometheus
    container_name: safia-telemetry
    extra_hosts:
      - "vpn:host-gateway"
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yml
    networks:
      - localnet

  monitoring:
    image: grafana/grafana
    container_name: safia-monitoring
    ports:
      - "3000:3000" 
    networks:
      - localnet

