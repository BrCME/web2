services:
  sql:
    image: postgres:17.5-alpine3.22
    container_name: sofia-sql
    restart: always
    environment:
      - POSTGRES_DB=db_sofia
      - POSTGRES_USER=user_sofia
      - POSTGRES_PASSWORD=P455W0RD_S0F14
    ports:
      - 5444:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready", "-d", "db_sofia"]
      interval: 10s
      timeout: 5s
      retries: 3
    volumes:
      - localsql:/var/lib/postgres/data
    networks:
      - localnet

  cache:
    image: redis:8.0.3-alpine3.21
    # image: valkey:8-alpine3.22
    # image: memcached:1.6.39-alpine3.22
    container_name: sofia-cache
    restart: always
    mem_limit: 1024mb
    ports:
      - 6379:6379
    volumes:
      - localcache:/data
    networks:
      - localnet

  sonarqube:
    image: sonarqube:lts-community
    container_name: sofia-code-quality
    restart: always
    environment:
      - SONAR_LOGIN=sofia
      - SONAR_PASSWORD=s0n4r_P455W0RD_S0F14
    ports:
      - 9000:9000
    volumes:
      - localcodequalitydata:/opt/sonarqube/data
      - localcodequalitylogs:/opt/sonarqube/logs
      - localcodequalityextensions:/opt/sonarqube/extensions
    networks:
      - localnet
    # token: sqp_67c73551a443a9fa2d849c51999d47339786f686

